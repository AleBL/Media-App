<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media App</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app" class="min-h-screen dark:bg-slate-800 dark:text-gray-200">
      <!-- The loading screen, until the app takes its place. Its classes
           come from the stylesheet of the app, which loads before the page
           shows; the size of the icon holds without it. -->
      <div
        role="status"
        class="flex min-h-screen flex-col items-center justify-center gap-6"
      >
        <img
          src="/favicon.png"
          alt=""
          width="72"
          height="72"
          class="rounded-2xl shadow-md"
        />
        <span
          aria-hidden="true"
          class="h-6 w-6 animate-spin rounded-full border-2 border-primary-600 border-r-transparent motion-reduce:animate-[spin_2s_linear_infinite] dark:border-primary-400 dark:border-r-transparent"
        ></span>
        <span class="sr-only">Loading Media App</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
